<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="To-Do, plataforma de gestión empresarial">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="To-Do">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>To-Do</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Maps no bloquea la página: se descarga en paralelo y rutasDirections ya
       responde con error controlado si todavía no llegó. -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDDQyLH4aIQM3f9rWHMDXR19bW5eWFGHeA"></script>
  <style>
    /* Esqueleto de arranque: se ve mientras Flutter descarga y pinta el primer
       frame. Queda detrás de la app (z-index:-1) y se oculta solo al existir
       flt-glass-pane, sin JavaScript (la CSP no admite scripts inline nuevos). */
    html, body { margin: 0; background: #f7f9fa; }
    #arranque { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    #arranque .barra { height: 64px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    #arranque .cuerpo { max-width: 960px; margin: 28px auto; padding: 0 16px; }
    #arranque .fila { display: flex; align-items: center; gap: 14px; height: 72px; }
    #arranque .av, #arranque .l { background: #e3e9ec; animation: pulso 1.1s ease-in-out infinite alternate; }
    #arranque .av { width: 40px; height: 40px; border-radius: 50%; flex: none; }
    #arranque .t { flex: 1; }
    #arranque .l { height: 13px; border-radius: 6px; margin: 6px 0; width: 60%; }
    #arranque .l.b { height: 10px; width: 85%; }
    @keyframes pulso { from { opacity: .45; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #arranque .av, #arranque .l { animation: none; } }
    body:has(flt-glass-pane) #arranque { display: none; }
  </style>
  <script>
    window.rutasDirections = function(payloadJson) {
      return new Promise(function(resolve) {
        try {
          const payload = JSON.parse(payloadJson || '{}');
          if (!window.google || !google.maps || !google.maps.DirectionsService) {
            resolve(JSON.stringify({
              ok: false,
              error: 'Google Maps JavaScript API no está cargada.'
            }));
            return;
          }

          const toLatLng = (p) => new google.maps.LatLng(p.lat, p.lng);
          const waypoints = (payload.waypoints || []).map((p) => ({
            location: toLatLng(p),
            stopover: true
          }));
          const service = new google.maps.DirectionsService();
          service.route({
            origin: toLatLng(payload.origin),
            destination: toLatLng(payload.destination),
            waypoints: waypoints,
            optimizeWaypoints: false,
            travelMode: google.maps.TravelMode.DRIVING,
            drivingOptions: {
              departureTime: new Date(),
              trafficModel: google.maps.TrafficModel.BEST_GUESS
            }
          }, function(result, status) {
            if (status !== 'OK' || !result || !result.routes || !result.routes.length) {
              resolve(JSON.stringify({ ok: false, error: status || 'Sin ruta' }));
              return;
            }

            const route = result.routes[0];
            let distanceMeters = 0;
            let durationSeconds = 0;
            let durationTrafficSeconds = 0;
            (route.legs || []).forEach(function(leg) {
              distanceMeters += (leg.distance && leg.distance.value) || 0;
              durationSeconds += (leg.duration && leg.duration.value) || 0;
              durationTrafficSeconds +=
                (leg.duration_in_traffic && leg.duration_in_traffic.value) ||
                (leg.duration && leg.duration.value) ||
                0;
            });

            const points = (route.overview_path || []).map(function(p) {
              return { lat: p.lat(), lng: p.lng() };
            });
            resolve(JSON.stringify({
              ok: true,
              distanceMeters: distanceMeters,
              durationSeconds: durationSeconds,
              durationTrafficSeconds: durationTrafficSeconds,
              points: points
            }));
          });
        } catch (e) {
          resolve(JSON.stringify({
            ok: false,
            error: e && e.message ? e.message : String(e)
          }));
        }
      });
    };
  </script>
</head>
<body>
  <div id="arranque" aria-hidden="true">
    <div class="barra"></div>
    <div class="cuerpo">
      <div class="fila"><div class="av"></div><div class="t"><div class="l"></div><div class="l b"></div></div></div>
      <div class="fila"><div class="av"></div><div class="t"><div class="l"></div><div class="l b"></div></div></div>
      <div class="fila"><div class="av"></div><div class="t"><div class="l"></div><div class="l b"></div></div></div>
      <div class="fila"><div class="av"></div><div class="t"><div class="l"></div><div class="l b"></div></div></div>
    </div>
  </div>
  <!-- PDF.js para extracción de texto de actas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
    window.pdfjsLib = pdfjsLib;

    window._extractPdfText = async function(uint8array) {
      try {
        const pdf = await pdfjsLib.getDocument({ data: uint8array, isEvalSupported: false }).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          const pageText = content.items
            .map(item => item.str || '')
            .join(' ');
          fullText += pageText + '\n';
        }
        return fullText.trim();
      } catch (e) {
        console.error('[PDF extract]', e);
        return '';
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
