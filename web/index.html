<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="To-Do, plataforma de gestión empresarial">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="To-Do">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>To-Do</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD8posdo50hmD8PLPD9kR6IebNYfi6PkPs"></script>
  <script>
    window.rutasDirections = function(payloadJson) {
      return new Promise(function(resolve) {
        try {
          const payload = JSON.parse(payloadJson || '{}');
          if (!window.google || !google.maps || !google.maps.DirectionsService) {
            resolve(JSON.stringify({
              ok: false,
              error: 'Google Maps JavaScript API no está cargada.'
            }));
            return;
          }

          const toLatLng = (p) => new google.maps.LatLng(p.lat, p.lng);
          const waypoints = (payload.waypoints || []).map((p) => ({
            location: toLatLng(p),
            stopover: true
          }));
          const service = new google.maps.DirectionsService();
          service.route({
            origin: toLatLng(payload.origin),
            destination: toLatLng(payload.destination),
            waypoints: waypoints,
            optimizeWaypoints: false,
            travelMode: google.maps.TravelMode.DRIVING,
            drivingOptions: {
              departureTime: new Date(),
              trafficModel: google.maps.TrafficModel.BEST_GUESS
            }
          }, function(result, status) {
            if (status !== 'OK' || !result || !result.routes || !result.routes.length) {
              resolve(JSON.stringify({ ok: false, error: status || 'Sin ruta' }));
              return;
            }

            const route = result.routes[0];
            let distanceMeters = 0;
            let durationSeconds = 0;
            let durationTrafficSeconds = 0;
            (route.legs || []).forEach(function(leg) {
              distanceMeters += (leg.distance && leg.distance.value) || 0;
              durationSeconds += (leg.duration && leg.duration.value) || 0;
              durationTrafficSeconds +=
                (leg.duration_in_traffic && leg.duration_in_traffic.value) ||
                (leg.duration && leg.duration.value) ||
                0;
            });

            const points = (route.overview_path || []).map(function(p) {
              return { lat: p.lat(), lng: p.lng() };
            });
            resolve(JSON.stringify({
              ok: true,
              distanceMeters: distanceMeters,
              durationSeconds: durationSeconds,
              durationTrafficSeconds: durationTrafficSeconds,
              points: points
            }));
          });
        } catch (e) {
          resolve(JSON.stringify({
            ok: false,
            error: e && e.message ? e.message : String(e)
          }));
        }
      });
    };
  </script>
</head>
<body>
  <!-- PDF.js para extracción de texto de actas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    window._extractPdfText = async function(uint8array) {
      try {
        const pdf = await pdfjsLib.getDocument({ data: uint8array }).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          const pageText = content.items
            .map(item => item.str || '')
            .join(' ');
          fullText += pageText + '\n';
        }
        return fullText.trim();
      } catch (e) {
        console.error('[PDF extract]', e);
        return '';
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
