# Un release con R8 también crea procesos nativos y workers. Reservar 8 GB de
# heap + 4 GB de metaspace provocaba que la JVM se quedara sin memoria en
# equipos de 16 GB. Estos límites dejan margen al sistema y hacen el build
# reproducible tanto localmente como en CI.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
